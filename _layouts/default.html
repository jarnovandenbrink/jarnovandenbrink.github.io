<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.layout == 'post' %}{{ page.title }}{% else %}{{ site.title }}{% endif %}</title>
<meta name="description" content="{{ page.description | default: site.description | strip_html | normalize_whitespace | truncate: 160 | escape }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="16x16" href="{{ '/assets/img/favicons/favicon-16x16.png' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/assets/img/favicons/favicon-32x32.png' | relative_url }}">
<link rel="icon" href="{{ '/assets/img/favicons/favicon.ico' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/assets/img/favicons/favicon-180x180.png' | relative_url }}">
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
<script>
(function () {
  var t = localStorage.getItem('theme') || 'dark';
  document.documentElement.setAttribute('data-theme', t);
})();
</script>
</head>
<body>
<div class="site">

  <header class="site-header">
    <div class="site-header-inner">
      <div class="site-header-right">
        <nav class="site-nav">
          <a href="{{ '/' | relative_url }}">index</a>
          <a href="{{ '/about/' | relative_url }}">about</a>
        </nav>
        <button id="theme-toggle" aria-label="Toggle light or dark mode" title="Toggle theme"><span class="theme-toggle-icon"><span></span></span></button>
      </div>
    </div>
  </header>

  {{ content }}

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>&copy; {{ 'now' | date: '%Y' }} {{ site.social.name | default: site.title }}</span>
      <a href="{{ '/feed.xml' | relative_url }}">rss</a>
    </div>
  </footer>

</div>
<script src="{{ '/assets/js/main.js' | relative_url }}"></script>
</body>
</html>
